services:
  # Oracle local. Hoy el equipo usa la base del servidor propio (por VPN), así
  # que este servicio es opcional y no arranca con `docker compose up`: hay que
  # pedirlo con `docker compose --profile db-local up`. Arranca vacío: todavía
  # no carga los scripts de db/.
  db:
    image: gvenzl/oracle-free:23-slim
    container_name: vidriera_oracle_db
    profiles: ["db-local"]
    environment:
      ORACLE_PASSWORD: root
      APP_USER: vidriera_user
      APP_USER_PASSWORD: vidriera123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  backend:
    build: ./backend
    container_name: vidriera_backend
    ports:
      - "8000:8000"
    # Mismas variables que usa el backend fuera de Docker (ver .envexample):
    # DB_USER, DB_CONNECTION, PASSWORD, JWT_SECRET_KEY, etc.
    env_file: .env
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: vidriera_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  oracle_data:
