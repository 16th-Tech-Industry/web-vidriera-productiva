services:
  # No hay servicio de base de datos: el backend se conecta a PostgreSQL con
  # DATABASE_URL del .env (en Railway la da su servicio PostgreSQL).
  backend:
    build: ./backend
    container_name: vidriera_backend
    ports:
      - "8000:8000"
    # Mismas variables que usa el backend fuera de Docker (ver .envexample):
    # DATABASE_URL, JWT_SECRET_KEY, etc.
    env_file: .env
    volumes:
      - ./backend:/app

  frontend:
    # En local, la etapa de desarrollo (Vite con recarga en caliente); Railway
    # construye la etapa de producción del mismo Dockerfile.
    build:
      context: ./frontend
      target: desarrollo
    container_name: vidriera_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # URL del backend vista desde el navegador (ver frontend/src/config.ts).
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
