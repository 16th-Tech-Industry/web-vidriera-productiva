services:
  # No hay servicio de base de datos: Oracle está en un servidor propio
  # (se accede por VPN) y el backend se conecta usando DB_CONNECTION del .env.
  backend:
    build: ./backend
    container_name: vidriera_backend
    ports:
      - "8000:8000"
    # Mismas variables que usa el backend fuera de Docker (ver .envexample):
    # DB_USER, DB_CONNECTION, PASSWORD, JWT_SECRET_KEY, etc.
    env_file: .env
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: vidriera_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # URL del backend vista desde el navegador (ver frontend/src/config.ts).
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
